[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax for the target version
    "DJ",   # Django-specific checks
    "S",    # bandit: security
    "SIM",  # simplifications
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixed test passwords and fake keys by design.
"tests/*" = ["S101", "S105", "S106", "S107", "S108"]
# Local demo data with a documented demo password.
"inventory/management/commands/seed_demo.py" = ["S105", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["config", "inventory", "finance", "sales", "ebay", "pricing", "api", "tests"]
