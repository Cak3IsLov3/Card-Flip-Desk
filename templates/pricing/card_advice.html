{% extends "base.html" %}
{% block title %}Price advice – {{ card }} – Card Flip Desk{% endblock %}
{% block content %}
<h1>Price advice</h1>
<p><a href="{% url 'inventory:card_detail' card.pk %}">← {{ card }}</a></p>

<form method="post" class="filters" hx-post="{% url 'pricing:card_advice' card.pk %}" hx-target="#advice" hx-swap="outerHTML"
      hx-indicator="#advice-loading">{% csrf_token %}
  <div class="field" style="flex: 1; min-width: 240px">
    <label for="q">eBay search query</label>
    <input id="q" name="q" value="{{ advice.query|default:default_query }}" maxlength="200">
  </div>
  <button class="secondary">Fetch active listings (eBay API)</button>
  <span id="advice-loading" class="htmx-indicator muted small">Fetching…</span>
</form>

{% include "pricing/_advice.html" %}
{% endblock %}
