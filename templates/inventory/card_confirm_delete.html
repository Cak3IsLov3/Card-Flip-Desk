{% extends "base.html" %}
{% block title %}Delete card – Card Flip Desk{% endblock %}
{% block content %}
<h1>Delete card</h1>
<p>Are you sure you want to delete <strong>{{ card }}</strong>? Its purchases, listings and sales are deleted too.</p>
<form method="post">{% csrf_token %}
  <button class="danger">Delete</button>
  <a href="{% url 'inventory:card_detail' card.pk %}">Cancel</a>
</form>
{% endblock %}
