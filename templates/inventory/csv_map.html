{% extends "base.html" %}
{% block title %}Map columns – Card Flip Desk{% endblock %}
{% block content %}
<h1>Map columns</h1>
<section class="panel">
  <h2>Preview</h2>
  <pre class="preview">{% for line in preview %}{{ line }}
{% endfor %}</pre>
</section>
<form method="post" class="panel">{% csrf_token %}
  <div class="grid">{% include "_form_fields.html" %}</div>
  <button>Import</button>
  <a href="{% url 'inventory:csv_upload' %}">Different file</a>
</form>
{% endblock %}
