{% if card.age_days is None %}<span class="muted">–</span>{% else %}<span class="age{% if card.stale_level %} age-{{ card.stale_level }}{% endif %}">{{ card.age_days }}</span>{% if card.is_pinned %} <span class="badge" title="Vastgezet tot {{ card.held_until|date:'d-m-Y' }}">vast</span>{% elif card.stale_level == "warning" %} <span class="badge badge-warning">let op</span>{% elif card.stale_level == "action" %} <span class="badge badge-action">actie</span>{% elif card.stale_level == "critical" %} <span class="badge badge-critical">kritiek</span>{% endif %}{% endif %}
