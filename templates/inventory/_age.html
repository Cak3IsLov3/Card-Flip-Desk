{% if card.age_days is None %}<span class="muted">–</span>{% else %}<span class="age{% if card.stale_level %} age-{{ card.stale_level }}{% endif %}">{{ card.age_days }}</span>{% if card.is_pinned %} <span class="badge" title="Pinned until {{ card.held_until|date:'d-m-Y' }}">pinned</span>{% elif card.stale_level == "warning" %} <span class="badge badge-warning">warning</span>{% elif card.stale_level == "action" %} <span class="badge badge-action">action</span>{% elif card.stale_level == "critical" %} <span class="badge badge-critical">critical</span>{% endif %}{% endif %}
