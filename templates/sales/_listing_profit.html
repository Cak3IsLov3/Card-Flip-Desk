{% load money %}
{% if preview %}
<small class="{% if preview.is_loss %}bad{% else %}muted{% endif %}">
  At this price (excluding shipping): commission {{ preview.commission|euro }}, profit <strong>{{ preview.profit|euro }}</strong>, margin {{ preview.margin|pct }}.
  {% if preview.is_loss %}You make a loss.{% endif %}
</small>
{% endif %}
